name: Post Daily Report to Issue

on:
  push:
    paths:
      - 'reports/**.md'

permissions:
  issues: write

jobs:
  post-comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post report as issue comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          for f in reports/*.md; do
            [ -f "$f" ] || continue
            DATE=$(basename "$f" .md)
            echo "Processing $f (date: $DATE)"

            # Check if already posted
            EXISTING=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$OWNER/$REPO/issues/1/comments?per_page=100" \
              | grep -c "每日重磅发现 — $DATE" || true)

            if [ "$EXISTING" -gt 0 ]; then
              echo "Report $DATE already posted, skipping"
              continue
            fi

            echo "Posting report for $DATE"
            BODY=$(cat "$f")

            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -H "Accept: application/vnd.github+json" \
              --data-binary "$(jq -n --arg body "$BODY" '{body: $body}')" \
              "https://api.github.com/repos/$OWNER/$REPO/issues/1/comments" \
              | jq '{id: .id, created_at: .created_at}'

            echo "Done posting $DATE"
          done
